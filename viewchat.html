     document.write("<a>"+st+"</a>");

    var p=[];
    fetch('https://yangzhengqi6.github.io/website/prechat.txt')
    .then(response => response.text())
    .then(text =>{
      var s="";
      var cnt=1;
      var size=0;
      var ss=[];
      for(size;text[size]!=ss[1]&&size<=200;size++);
      for(var i=0;i<=size-1;i++){
          if(text[i]=='\n'){
            continue;
          }
          else if(text[i]=='\r'){
          if(cnt%2==0){
            s+="</d>";
            s+="<br>";
          }else{
            s+=":";
            s+="<d>";
          }
          cnt++;
        }else{
          s+=text[i];
        }
      // writeln(s);
      document.getElementById("content").innerHTML = s;
      }
    })
    .catch(error => console.error('ERR:Server returned ', error));
  </script>
